<!-- Responsive Image Gallery -> Build a grid-based image gallery that adapts to screen size. Exercise: Create a 3-column image grid that:
• Shows 3 images per row on desktop
• Stacks to 1 column on mobile
• Includes proper spacing
Outcome:
• Introduces Flexbox layout
• Implements media queries
• Practices responsive design principles. -->


<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Responsive Image Gallery</title>

    <style>
        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        /* Gallery container using Flexbox */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            /* spacing between images */
        }

        /* Each image box */
        .gallery-item {
            flex: 1 1 calc(33.33% - 20px);
            /* 3 columns */
        }

        /* Image styling */
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 5px gray;
        }

        /* Mobile view (1 column) */
        @media screen and (max-width: 600px) {
            .gallery-item {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
