<!-- Survey for the improvement of the website
Problem Description -> A Create a survey form for the improvement of a website.
Tasks:
• The detail of the customer needs to be input like Name, Email and Age.
• Then add a drop down for the profession.
• A radio button for the feedback of the webpage with options
• Add a drop down for the content you like the most with an inbuilt option drop down menu
• Multiple option selection checkbox is to be added for the improvements in the future. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Improvement Survey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Website Improvement Survey</h1>
            <p>Your feedback helps us improve our website experience</p>
        </div>

        <form>
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label>Profession</label>
                <select>
                    <option>Select your profession</option>
                    <option>Student</option>
                    <option>Developer</option>
                    <option>Designer</option>
                    <option>Teacher</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>How do you rate our website?</label>
                <div class="option-group">
                    <label><input type="radio" name="feedback"> Excellent</label>
                    <label><input type="radio" name="feedback"> Good</label>
                    <label><input type="radio" name="feedback"> Average</label>
                    <label><input type="radio" name="feedback"> Poor</label>
                </div>
            </div>

            <div class="form-group">
                <label>What content do you like the most?</label>
                <select>
                    <option>Select an option</option>
                    <option>Design</option>
                    <option>Content Quality</option>
                    <option>Navigation</option>
                    <option>Performance</option>
                    <option>Features</option>
                </select>
            </div>

            <div class="form-group">
                <label>What improvements would you like?</label>
                <div class="option-group">
                    <label><input type="checkbox"> Improve design</label>
                    <label><input type="checkbox"> Add more features</label>
                    <label><input type="checkbox"> Increase speed</label>
                    <label><input type="checkbox"> Improve mobile responsiveness</label>
                    <label><input type="checkbox"> Better content</label>
                </div>
            </div>

            <button type="submit">Submit Survey</button>
        </form>

        <div class="form-footer">
            Thank you for helping us improve!
        </div>
    </div>
</body>
</html>
