<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pricing Cards</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

<h2 class="text-center mb-5">Pricing Plans</h2>

<div class="row">

<!-- Card 1 -->
<div class="col-lg-4 col-md-6 mb-4">

<div class="card text-center h-100">

<div class="card-body">

<h4 class="card-title">Basic</h4>

<h2 class="text-primary">$9/month</h2>

<ul class="list-group list-group-flush my-3">

<li class="list-group-item">1 User</li>
<li class="list-group-item">10GB Storage</li>
<li class="list-group-item">Email Support</li>

</ul>

<button class="btn btn-primary">Sign Up</button>

</div>

</div>

</div>

<!-- Card 2 -->
<div class="col-lg-4 col-md-6 mb-4">

<div class="card text-center h-100">

<div class="card-body">

<h4 class="card-title">Standard</h4>

<h2 class="text-success">$19/month</h2>

<ul class="list-group list-group-flush my-3">

<li class="list-group-item">5 Users</li>
<li class="list-group-item">50GB Storage</li>
<li class="list-group-item">Priority Support</li>

</ul>

<button class="btn btn-success">Sign Up</button>

</div>

</div>

</div>

<!-- Card 3 -->
<div class="col-lg-4 col-md-6 mb-4">

<div class="card text-center h-100">

<div class="card-body">

<h4 class="card-title">Premium</h4>

<h2 class="text-danger">$29/month</h2>

<ul class="list-group list-group-flush my-3">

<li class="list-group-item">Unlimited Users</li>
<li class="list-group-item">200GB Storage</li>
<li class="list-group-item">24/7 Support</li>

</ul>

<button class="btn btn-danger">Sign Up</button>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
