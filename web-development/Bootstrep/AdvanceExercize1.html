<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bootstrap Image Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light" id="pageBody">

<div class="container py-4">

<h2 class="text-center mb-4">Responsive Image Gallery</h2>

<div class="text-end mb-3">
<button class="btn btn-dark" onclick="toggleTheme()">Toggle Theme</button>
</div>

<div class="row">

<!-- Image 1 -->
<div class="col-lg-6 col-md-6 mb-4">

<img src="https://picsum.photos/id/1015/600/400"
class="img-fluid rounded"
alt="Nature Image 1"
data-bs-toggle="modal"
data-bs-target="#galleryModal"
onclick="openImage(0)">

</div>

<!-- Image 2 -->
<div class="col-lg-6 col-md-6 mb-4">

<img src="https://picsum.photos/id/1025/600/400"
class="img-fluid rounded"
alt="Nature Image 2"
data-bs-toggle="modal"
data-bs-target="#galleryModal"
onclick="openImage(1)">

</div>

<!-- Image 3 -->
<div class="col-lg-6 col-md-6 mb-4">

<img src="https://picsum.photos/id/1035/600/400"
class="img-fluid rounded"
alt="Nature Image 3"
data-bs-toggle="modal"
data-bs-target="#galleryModal"
onclick="openImage(2)">

</div>

<!-- Image 4 -->
<div class="col-lg-6 col-md-6 mb-4">

<img src="https://picsum.photos/id/1045/600/400"
class="img-fluid rounded"
alt="Nature Image 4"
data-bs-toggle="modal"
data-bs-target="#galleryModal"
onclick="openImage(3)">

</div>

</div>

</div>

<!-- Modal -->

<div class="modal fade" id="galleryModal">

<div class="modal-dialog modal-lg modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">Image Preview</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body text-center">

<img id="modalImage" class="img-fluid">

<p id="caption" class="mt-2"></p>

</div>

<div class="modal-footer">

<button class="btn btn-secondary" onclick="prevImage()">Previous</button>

<button class="btn btn-primary" onclick="nextImage()">Next</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

let images = [
"https://picsum.photos/id/1015/900/600",
"https://picsum.photos/id/1025/900/600",
"https://picsum.photos/id/1035/900/600",
"https://picsum.photos/id/1045/900/600"
];

let captions = [
"Beautiful Mountain",
"Cute Dog",
"Peaceful River",
"Forest Landscape"
];

let currentIndex = 0;

function openImage(index){

currentIndex = index;

document.getElementById("modalImage").src = images[index];

document.getElementById("caption").innerText = captions[index];

}

function nextImage(){

currentIndex = (currentIndex + 1) % images.length;

openImage(currentIndex);

}

function prevImage(){

currentIndex = (currentIndex - 1 + images.length) % images.length;

openImage(currentIndex);

}

function toggleTheme(){

let body = document.getElementById("pageBody");

if(body.classList.contains("bg-light")){

body.classList.remove("bg-light");

body.classList.add("bg-dark","text-white");

}else{

body.classList.remove("bg-dark","text-white");

body.classList.add("bg-light");

}

}

</script>

</body>
</html>
