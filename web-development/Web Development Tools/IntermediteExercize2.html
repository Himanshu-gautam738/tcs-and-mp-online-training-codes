<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery with Lightbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 50px auto;
        }

        .gallery img {
            width: 100%;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Image Gallery</h1>

    <div class="gallery">
        <img src="https://source.unsplash.com/200x200/?nature,1" alt="Nature 1">
        <img src="https://source.unsplash.com/200x200/?nature,2" alt="Nature 2">
        <img src="https://source.unsplash.com/200x200/?nature,3" alt="Nature 3">
        <img src="https://source.unsplash.com/200x200/?nature,4" alt="Nature 4">
    </div>

    <div class="modal" id="modal">
        <span class="close-btn" id="close">&times;</span>
        <img id="modal-img" src="" alt="Full Size">
    </div>

    <script>
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.getElementById('close');

        document.querySelectorAll('.gallery img').forEach(img => {
            img.addEventListener('click', () => {
                modal.style.display = 'flex';
                modalImg.src = img.src.replace('200x200', '600x600'); // larger image
                modalImg.alt = img.alt;
            });
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });
    </script>

</body>

</html>
