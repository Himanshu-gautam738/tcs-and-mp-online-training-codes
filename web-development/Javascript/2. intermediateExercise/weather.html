<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Weather App</title>
    <style>
        body 
        {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
            transition: background 1s ease;

        }

        .default {
            background: linear-gradient(135deg, #1e3a8a, #38bdf8);
        }
        .sunny {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
        }
        .cloudy {
            background: linear-gradient(135deg, #64748b, #94a3b8);
        }
        .rainy {
            background: linear-gradient(135deg, #0f172a, #334155);
        }
        .snowy {
            background: linear-gradient(135deg, #e0f2fe, #7dd3fc);
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            width: 320px;
            text-align: center;
            color: white;
        }

        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .icon {
            font-size: 70px;
            margin: 15px;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .temp {
            font-size: 40px;
        }

        .city {
            font-size: 20px;
        }
    </style>
</head>

<body class="default">
    <div class="card">
        <h2>Weather App</h2>
        <input type="text" id="cityInput" placeholder="Enter city">
        <button onclick="getWeather()">Search</button>
        <div class="icon" id="icon">☀️</div>
        <div class="temp" id="temp">--°C</div>
        <div class="city" id="city">City</div>
        <div id="condition">Condition</div>
    </div>

    <script>
        const apiKey = "bd5e378503939ddaee76f12ad7a97608";
        async function getWeather() {
            const city = document.getElementById("cityInput").value;
            if (!city) {
                alert("Enter city");
                return;
            }

            const response = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
            );

            const data = await response.json();
            if (data.cod !== 200) {
                alert("City not found");
                return;
            }

            const temp = Math.round(data.main.temp);
            const name = data.name;
            const country = data.sys.country;
            const condition = data.weather[0].main.toLowerCase();

            document.getElementById("temp").innerHTML = temp + "°C";
            document.getElementById("city").innerHTML = name + ", " + country;
            document.getElementById("condition").innerHTML = condition;

            setWeatherUI(condition);
        }

        function setWeatherUI(condition) {
            const icon = document.getElementById("icon");
            document.body.className = "";
            if (condition.includes("clear")) {
                icon.innerHTML = "☀️";
                document.body.classList.add("sunny");
            }
            else if (condition.includes("cloud")) {
                icon.innerHTML = "☁️";
                document.body.classList.add("cloudy");
            }
            else if (condition.includes("rain")) {
                icon.innerHTML = "🌧️";
                document.body.classList.add("rainy");
            }
            else if (condition.includes("snow")) {
                icon.innerHTML = "❄️";
                document.body.classList.add("snowy");
            }
            else if (condition.includes("thunder")) {
                icon.innerHTML = "⚡";
                document.body.classList.add("rainy");
            }
            else {
                icon.innerHTML = "🌡️";
                document.body.classList.add("default");
            }
        }
    </script>
</body>
</html>
