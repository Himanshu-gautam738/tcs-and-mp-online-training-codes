<!-- Weather App (API Fetch) - Fetch weather data from a public API.
Create a 3-column image grid that:
• Use the OpenWeatherMap API
• Display temperature for a user-entered city
Outcome:
• Async/await for API calls
• JSON data handling -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .weather-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            margin-top: 15px;
        }

        button {
            width: 50%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="weather-card">
        <h2>Weather App</h2>
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
        <div class="result" id="result">
            Weather info will appear here
        </div>
    </div>

    <script>
        const apiKey = "bd5e378503939ddaee76f12ad7a97608";

        /* FETCH WEATHER FUNCTION */
        async function getWeather() {
            const city = document.getElementById("city").value;
            if (city === "") {
                alert("Please enter a city name");
                return;
            }

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
                );

                const data = await response.json();
                if (data.cod !== 200) {
                    document.getElementById("result").innerHTML = "City not found";
                    return;
                }

                const temperature = data.main.temp;
                const weather = data.weather[0].description;
                const country = data.sys.country;
                document.getElementById("result").innerHTML =
                    `<b>City:</b> ${city}, ${country} <br><br>
                    <b>Temperature:</b> ${temperature} °C <br><br>
                    <b>Condition:</b> ${weather}`;
            }
            catch (error) {
                document.getElementById("result").innerHTML = "Error fetching weather data";
            }
        }
    </script>
</body>
</html>
