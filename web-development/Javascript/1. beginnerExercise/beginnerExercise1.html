<!-- Temperature Converter - Build a program that converts Celsius to Fahrenheit and vice versa.
Build a JavaScript page that includes:
• Take user input (number + unit)
• Convert between Celsius (°C) and Fahrenheit (°F)
• Display the converted value
Outcome
• Understands variables, conditionals, and user input
• Practices basic arithmetic operations -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature Converter</title>
    <style>
        body 
        {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6693f6, #5bc7f6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .converter-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input, select {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: #15bd1b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            background: #13b404;
        }

        .result {
            margin-top: 15px;
            font-weight:600;
            font-family: cursive;
            font-size: 18px;
            color: #69b045;
        }
    </style>
</head>
<body>
    <div class="converter-card">
        <h2>
            Temperature Converter
        </h2>
        <input type="number" id="temperature" placeholder="Enter temperature">
        <select id="unit">
            <option value="C">Celsius to Fahrenheit</option>
            <option value="F">Fahrenheit to Celsius</option>
        </select>
        <button onclick="convertTemperature()">Convert</button>
        <div class="result" id="result"> Result will appear here </div>
    </div>

    <script>
        {
            // get input value
            let temp = document.getElementById("temperature").value;

            // get selected unit
            let unit = document.getElementById("unit").value;

            let result;
            if (temp === "") {
                document.getElementById("result").innerHTML =
                    "Please enter a value";
                return;
            }

            // convert string to number
            temp = parseFloat(temp);

            // Celsius → Fahrenheit
            if (unit === "C") {
                result = (temp * 9 / 5) + 32;
                document.getElementById("result").innerHTML = temp + " °C = " + result.toFixed(2) + " °F";
            }

            // Fahrenheit → Celsius
            else {
                result = (temp - 32) * 5 / 9;
                document.getElementById("result").innerHTML = temp + " °F = " + result.toFixed(2) + " °C";
            }
        }
    </script>
</body>
</html>
