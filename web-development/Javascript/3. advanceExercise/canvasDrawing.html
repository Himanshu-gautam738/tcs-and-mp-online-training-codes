<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Paint App</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI";
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            margin-top: 60px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        canvas {
            border: 2px solid #2a6eff;
            border-radius: 8px;
            cursor: crosshair;
        }

        .toolbar {
            margin-bottom: 10px;
        }

        button {
            margin: 2px;
            padding: 6px 12px;
            border: none;
            background: #348cf1;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #3b64d3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Advanced Paint App</h3>
        <div class="toolbar">
            <button onclick="setTool('pencil')">Pencil</button>
            <button onclick="setTool('eraser')">Eraser</button>
            <button onclick="setTool('rect')">Rectangle</button>
            <button onclick="setTool('circle')">Circle</button>
            <button onclick="undo()">Undo</button>
            <button onclick="clearCanvas()">Clear</button>
            <button onclick="saveImage()">Save</button>
            <br><br>
            Color: <input type="color" id="color" value="#000000">
            Size: <input type="range" id="size" min="1" max="20" value="3">
        </div>
        <canvas id="canvas" width="700" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let drawing = false;
        let tool = "pencil";
        let startX, startY;
        let history = [];

        /* SAVE STATE */
        function saveState() {
            history.push(canvas.toDataURL());
        }

        /* TOOL SELECT */
        function setTool(t) {
            tool = t;
        }

        /* START */
        canvas.addEventListener("mousedown", (e) => {
            drawing = true;
            startX = e.offsetX;
            startY = e.offsetY;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            saveState();
        });

        /* DRAW */
        canvas.addEventListener("mousemove", (e) => {
            if (!drawing) return;
            const x = e.offsetX;
            const y = e.offsetY;
            ctx.lineWidth = document.getElementById("size").value;
            ctx.strokeStyle = document.getElementById("color").value;
            ctx.lineCap = "round";

            if (tool === "pencil") {
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            else if (tool === "eraser") {
                ctx.strokeStyle = "white";
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        });

        /* STOP */
        canvas.addEventListener("mouseup", (e) => {
            drawing = false;
            const x = e.offsetX;
            const y = e.offsetY;

            if (tool === "rect") {
                ctx.strokeRect(startX, startY, x - startX, y - startY);
            }

            if (tool === "circle") {
                const radius = Math.sqrt(
                    Math.pow(x - startX, 2) + Math.pow(y - startY, 2)
                );

                ctx.beginPath();
                ctx.arc(startX, startY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        });

        /* UNDO */
        function undo() {
            if (history.length > 0) {
                let img = new Image();
                img.src = history.pop();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                }
            }
        }

        /* CLEAR */
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        /* SAVE IMAGE */
        function saveImage() {
            let link = document.createElement("a");
            link.download = "drawing.png";
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>

</html>
